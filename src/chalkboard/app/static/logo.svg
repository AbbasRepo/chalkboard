<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chalkboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chalkboard</title>
  <!-- The board. Squared off, like a tactics board rather than an app tile. -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#1b2630"/>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="none" stroke="#e9e5d9" stroke-opacity=".22" stroke-width="2"/>

  <!-- A pass between two players: the one relationship the whole graph is
       built on, drawn as a chalk stroke. -->
  <path d="M17 44 Q32 16 47 32" fill="none" stroke="#e9e5d9" stroke-width="3"
        stroke-linecap="round" stroke-opacity=".92"/>
  <!-- The answer coming back: the second stroke, in the supporter's amber. -->
  <path d="M47 32 Q38 46 25 46" fill="none" stroke="#d9a95c" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="1 6" stroke-opacity=".95"/>

  <circle cx="17" cy="44" r="5.5" fill="#1b2630" stroke="#e9e5d9" stroke-width="3"/>
  <circle cx="47" cy="32" r="5.5" fill="#d9a95c"/>
</svg>
