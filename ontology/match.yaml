# Chalkboard match ontology
#
# THE file to read first. It is the whole semantic model: the nouns that
# become nodes, the verbs that become relationships, and the adjectives and
# adverbs that become properties on each.
#
# Two rules govern it.
#
# 1. ARITY DECIDES SHAPE. An action with two participants is a relationship:
#    a pass is Player -> Player, and modelling it as a node would turn a
#    one-hop fact into a two-hop detour. An action with more than two -
#    a shot involves shooter, keeper, zone and sometimes an assister - has
#    no choice but to be a node. Nothing is reified for taste.
#
# 2. STRUCTURE ONLY. No conditions, no loops, no expressions. The moment
#    this file needs one, that logic belongs in graph/loader.py. A config
#    language that grows a brain is a programming language nobody
#    documented.
#
# Coordinates and zones are attack-relative: always from the perspective of
# the team in possession. No query ever needs to know which way the teams
# are kicking.

# ---------------------------------------------------------------- the world

entities:

  Competition:
    key: competition_id
    properties: [name, season]

  Match:
    key: match_id
    properties:
      - matchweek
      - kickoff_utc
      - period_length_s
      - score_home
      - score_away
      # Pre-game forecast, stored so the narrative can argue with the result.
      - pre_game_win_prob_home
      - pre_game_draw_prob
      - pre_game_win_prob_away
      - pre_game_xg_home
      - pre_game_xg_away
      - prediction_model

  Stadium:
    key: stadium_id
    properties: [name, capacity, pitch_length_m, pitch_width_m]

  Team:
    key: team_id
    properties: [name, short_name]
    # Note: formation and style are per-match choices, so they live on the
    # HOME_TEAM / AWAY_TEAM edge rather than here.

  Player:
    key: player_id
    properties: [name]
    # Shirt number and position are facts about a player in a match, not
    # about the player. They live on PLAYED_IN.

  Referee:
    key: referee_id
    properties: [name]
    # Role is per appointment - the same official referees one week and runs
    # the line the next - so it lives on OFFICIATED_BY.

  Zone:
    key: zone_id
    properties: [band, channel, name, half_space]
    # 18 zones: six bands by three channels. Space is modelled as nodes so
    # actions can point into it, and so "the attack shifted channels" is a
    # traversal rather than arithmetic on coordinates.

# ------------------------------------------------- actions with >2 participants

reified:

  Shot:
    key: event_id
    source_type: SHOT
    properties: [clock_s, period, match_id, possession_id, shot_xg,
                 shot_speed_ms, body_part, outcome, pressure]

  Foul:
    key: event_id
    source_type: FOUL
    properties: [clock_s, period, match_id, card, pressure]

  Insight:
    key: insight_id
    # Not part of the football domain. This is the system's own record of
    # what it said, kept so every sentence can be walked back to the facts
    # behind it.
    properties: [clock_s, match_id, score, sentence, persona, language]

# ------------------------------------------------------------ the skeleton

structure:

  - type: IN_COMPETITION
    from: {node: Match, key: match_id}
    to:   {node: Competition, key: competition_id}

  - type: PLAYED_AT
    from: {node: Match, key: match_id}
    to:   {node: Stadium, key: stadium_id}

  - type: OFFICIATED_BY
    from: {node: Match, key: match_id}
    to:   {node: Referee, key: referee_id}
    properties: [role]

  - type: HOME_TEAM
    from: {node: Match, key: match_id}
    to:   {node: Team, key: team_id}
    properties: [formation, style]

  - type: AWAY_TEAM
    from: {node: Match, key: match_id}
    to:   {node: Team, key: team_id}
    properties: [formation, style]

  - type: PLAYS_FOR
    from: {node: Player, key: player_id}
    to:   {node: Team, key: team_id}

  - type: PLAYED_IN
    from: {node: Player, key: player_id}
    to:   {node: Match, key: match_id}
    properties: [shirt_number, position, starter, minutes]

  - type: ADJACENT_TO
    from: {node: Zone, key: zone_id}
    to:   {node: Zone, key: zone_id}
    # Static pitch topology, loaded once per graph.

# --------------------------------------------------------------- the actions
#
# Every action edge carries the temporal spine: clock_s, period, match_id,
# possession_id, sequence, outcome. match_id matters because the graph holds
# several matches and Zone nodes are shared across all of them - without it,
# "where does this side press" silently mixes fixtures.

actions:

  - type: PASSED_TO
    source_type: [PASS, CROSS]
    from: {node: Player, key: player_id}
    to:   {node: Player, key: related_player_id}
    properties: [pass_distance_m, pass_angle_deg, pass_progressive,
                 pass_difficulty, ball_speed_ms, pressure, hold_time_s,
                 start_zone, end_zone]

  - type: CARRIED_INTO
    source_type: [CARRY]
    from: {node: Player, key: player_id}
    to:   {node: Zone, key: end_zone}
    properties: [pass_distance_m, pressure, hold_time_s, start_zone]

  - type: DISPOSSESSED
    source_type: [TACKLE, INTERCEPTION]
    from: {node: Player, key: player_id}
    to:   {node: Zone, key: start_zone}
    properties: [pressure, opponents_within_5m]

  - type: PRESSED_IN
    source_type: [PRESSURE]
    from: {node: Player, key: player_id}
    to:   {node: Zone, key: start_zone}
    properties: [pressure, opponents_within_5m]

  - type: TOOK
    source_type: [SHOT]
    from: {node: Player, key: player_id}
    to:   {node: Shot, key: event_id}

  - type: FROM_ZONE
    source_type: [SHOT]
    from: {node: Shot, key: event_id}
    to:   {node: Zone, key: start_zone}

  - type: SAVED_BY
    source_type: [SAVE]
    from: {node: Shot, key: event_id}
    to:   {node: Player, key: player_id}

# ------------------------------------------------------- provenance of output

provenance:

  - type: EVIDENCED_BY
    from: {node: Insight, key: insight_id}
    to:   {node: Shot, key: event_id}

  - type: ABOUT_PLAYER
    from: {node: Insight, key: insight_id}
    to:   {node: Player, key: player_id}

  - type: ABOUT_ZONE
    from: {node: Insight, key: insight_id}
    to:   {node: Zone, key: zone_id}

  - type: IN_MATCH
    from: {node: Insight, key: insight_id}
    to:   {node: Match, key: match_id}

# ------------------------------------------------------------------ derived
#
# Recomputed on a timer by derived.cypher, never written by the loader.
# These are the clean aggregate edges the UI draws: the raw action edges
# underneath are what make their weights true and what an insight cites.

derived:
  - type: LINKS_WITH        # Player -> Player   passes, progression, difficulty
  - type: CIRCULATES_THROUGH # Team  -> Player   received share, centrality
  - type: PRESSES_IN        # Team   -> Zone     turnovers forced, intensity
  - type: NEMESIS_OF        # Player -> Player   duels, win rate
